<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Team — HYPNEXIS '26</title>
<meta name="description" content="Meet the faculty coordinators and convenors organising HYPNEXIS '26, the CCE Dept. hackathon at Manipal University Jaipur.">
<meta name="theme-color" content="#020c28">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23081846'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='900' fill='%23ffffff' text-anchor='middle'%3EHX%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;overflow-x:hidden;background:#020c28;color:#fff;font-family:'Inter',sans-serif;}

/* Same static backdrop as the main site (no cursor/WebGL scene here — kept light) */
body{
  background:
    radial-gradient(ellipse 900px 600px at 50% -10%,rgba(40,90,220,.22),transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 80%,rgba(30,70,190,.14),transparent 60%),
    #020c28;
}
#noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.02;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;}

/* NAV — identical to main site */
#nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:20px 36px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(2,12,40,.85),transparent);backdrop-filter:blur(8px);}
.nbrand{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:15px;font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 24px rgba(80,160,255,.8);text-decoration:none;}
.nbox{width:34px;height:34px;border:1.5px solid rgba(120,180,255,.6);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;background:rgba(10,30,140,.6);backdrop-filter:blur(8px);color:#fff;}
.nyr{font-size:.62em;opacity:.65;margin-left:3px;color:rgba(160,210,255,.9);}
.nlinks{display:flex;align-items:center;gap:24px;}
.nlink{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;color:rgba(200,225,255,.8);text-decoration:none;text-transform:uppercase;transition:color .3s;}
.nlink:hover{color:#fff;}
.nlink.active{color:#88ccff;}
.nav-logo{height:44px;width:auto;display:block;filter:invert(1) drop-shadow(0 0 10px rgba(80,160,255,.7));}
.nreg{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;padding:10px 24px;border:1px solid rgba(120,170,255,.55);color:#e0eeff;background:rgba(15,45,180,.4);backdrop-filter:blur(10px);cursor:pointer;text-decoration:none;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:all .3s;}
.nreg:hover{background:rgba(40,100,255,.6);border-color:rgba(160,210,255,.9);box-shadow:0 0 22px rgba(60,120,255,.5);color:#fff;}

/* SECTIONS — same tokens as main site */
.sec{position:relative;padding:150px 0 100px;z-index:10;}
.sec-inner{max-width:1080px;margin:0 auto;padding:0 48px;text-align:center;}
.eye{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.48em;color:#88ccff;text-transform:uppercase;margin-bottom:14px;display:block;text-shadow:0 0 20px rgba(100,180,255,.7);}
.sh{font-family:'Orbitron',monospace;font-size:clamp(28px,4vw,52px);font-weight:900;color:#ffffff;line-height:1.08;margin-bottom:18px;text-shadow:0 0 40px rgba(80,160,255,.5),0 2px 0 rgba(0,0,0,.4);}
.sh em{font-style:normal;color:#88ccff;text-shadow:0 0 30px rgba(100,200,255,.6);}
.sdv{width:40px;height:1px;background:rgba(120,180,255,.5);margin:16px auto 28px;}
.sp{font-size:15px;line-height:2;color:rgba(210,230,255,.9);max-width:560px;margin:0 auto;font-weight:300;}

.grouplabel{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.32em;color:rgba(180,215,255,.8);text-transform:uppercase;margin:64px 0 28px;text-align:left;}

/* TEAM CARDS — reuses .tc (domain card) treatment: same bg, border, blur, hover glow */
.tmgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;}
.tmc{background:rgba(8,22,72,.5);backdrop-filter:blur(12px);padding:26px 22px;text-align:center;border:1px solid rgba(80,140,255,.25);transition:border-color .3s,box-shadow .3s;position:relative;overflow:hidden;flex:1 1 260px;max-width:300px;}
.tmc:hover{border-color:rgba(130,200,255,.6);box-shadow:0 0 36px rgba(60,130,255,.2);}
.tmph{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;border:1.5px solid rgba(120,180,255,.5);background:rgba(15,40,140,.5);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Orbitron',monospace;font-weight:900;font-size:20px;color:rgba(190,220,255,.85);}
.tmph img{width:100%;height:100%;object-fit:cover;display:block;}
.tmname{font-family:'Orbitron',monospace;font-size:19px;font-weight:700;color:#fff;margin-bottom:8px;letter-spacing:.04em;}
.tmrole{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.16em;color:#88ccff;text-transform:uppercase;margin-bottom:4px;}
.tmdept{font-size:11px;color:rgba(200,225,255,.7);}

.tmempty{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;color:rgba(180,215,255,.5);text-align:left;padding:18px 0;}

/* REVEAL */
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}
.rv.vis{opacity:1;transform:translateY(0);}

/* FOOTER — identical to main site */
footer{position:relative;z-index:10;border-top:1px solid rgba(80,140,255,.2);padding:36px 44px;display:flex;justify-content:space-between;align-items:center;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;color:rgba(180,215,255,.7);background:rgba(2,10,35,.7);backdrop-filter:blur(10px);}
footer a{color:rgba(160,205,255,.8);text-decoration:none;}
footer a:hover{color:#fff;}

@media(max-width:768px){
  #nav{padding:16px 18px;}
  .nlinks{gap:14px;}
  .nav-logo{height:32px;}
  .sec{padding:120px 0 70px;}
  .sec-inner{padding:0 22px;}
  .tmgrid{flex-direction:column;align-items:center;}
  .tmc{max-width:340px;width:100%;}
  .grouplabel{text-align:center;}
  footer{flex-direction:column;gap:10px;text-align:center;}
}

/* FOCUS VISIBILITY */
a:focus-visible{outline:2px solid rgba(140,195,255,.9);outline-offset:3px;border-radius:2px;}

/* REDUCED MOTION */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}
</style>
</head>
<body>
<div id="noise"></div>

<nav id="nav">
  <a href="hypnexis-main.html" class="nbrand"><img class="nav-logo" src="images/hypnexis-logo.png" alt="HYPNEXIS '26"></a>
  <div class="nlinks">
    <a href="hypnexis-main.html" class="nlink">HOME</a>
    <a href="hypnexis-team.html" class="nlink active">TEAM</a>
    <a href="hypnexis-main.html" class="nreg">REGISTER NOW</a>
  </div>
</nav>

<main>
<section class="sec">
  <div class="sec-inner">
    <span class="eye rv vis">Meet The Organisers</span>
    <h1 class="sh rv vis">Our <em>Team</em></h1>
    <div class="sdv rv vis"></div>
    <p class="sp rv vis">The people from the Dept. of Computer &amp; Communication Engineering, MUJ, making HYPNEXIS '26 happen.</p>

    <h2 class="grouplabel rv vis">Faculty Coordinators</h2>
    <div class="tmgrid" id="facultyGrid"></div>

    <h2 class="grouplabel rv vis">Convenors</h2>
    <div class="tmgrid" id="convenorGrid"></div>

    <h2 class="grouplabel rv vis">Co-Convenors</h2>
    <div class="tmgrid" id="coConvenorGrid"></div>
  </div>
</section>
</main>

<footer>
  <div>© 2026 HYPNEXIS · CCE Dept., Manipal University Jaipur</div>
  <div>IN-PERSON</div>
  <div><a href="mailto:hypnexis@muj.manipal.edu">hypnexis@muj.manipal.edu</a></div>
</footer>

<script>
'use strict';

/* ====================================================
   TEAM DATA
   Add / remove people here — cards render automatically.
   Drop a real photo file named exactly as `photo` (e.g. "faculty1.jpg")
   next to this page and it will be picked up automatically.
   Leave `photo` empty ("") to keep the placeholder initials.
==================================================== */
// Photo convention: drop the real photo file into images/team/ using the
// filename already referenced below, then it appears automatically — no
// other code change needed. Left empty ("") until a real photo exists, so
// the page never requests a file that isn't there yet (a missing photo
// falls back to initials, not a random/placeholder image).
var facultyCoordinators = [
  { name: "Aditya Narayan Hati", role: "Faculty Coordinator", dept: "Dept. of CCE, MUJ", photo: "" }, // images/team/aditya-narayan-hati.jpg
  { name: "Rahul Sharma", role: "Faculty Coordinator", dept: "Dept. of CCE, MUJ", photo: "" }, // images/team/rahul-sharma.jpg
];

var convenors = [
  { name: "Akul Chitkara", role: "Convenor", dept: "", photo: "" }, // images/team/akul-chitkara.jpg
  { name: "Madhurjya Kakati", role: "Convenor", dept: "", photo: "" }, // images/team/madhurjya-kakati.jpg
];

// Empty for now, on purpose — add people here later exactly like the
// arrays above (name/role/dept/photo) and a card renders automatically.
var coConvenors = [
  // { name: "Full Name", role: "Co-Convenor", dept: "", photo: "images/team/full-name.jpg" },
];

function initials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();
}

function renderGrid(containerId, people){
  var el = document.getElementById(containerId);
  el.innerHTML = '';
  if(!people || !people.length){
    var empty = document.createElement('p');
    empty.className = 'tmempty';
    empty.textContent = 'To be announced.';
    el.appendChild(empty);
    return;
  }
  people.forEach(function(p){
    var card = document.createElement('div');
    card.className = 'tmc rv vis';

    var photo = document.createElement('div');
    photo.className = 'tmph';
    if(p.photo){
      var img = document.createElement('img');
      img.src = p.photo;
      img.alt = p.name;
      img.loading = 'lazy';
      img.addEventListener('error', function(){
        photo.textContent = initials(p.name);
      });
      photo.appendChild(img);
    } else {
      photo.textContent = initials(p.name);
    }

    var name = document.createElement('div');
    name.className = 'tmname';
    name.textContent = p.name;

    var role = document.createElement('div');
    role.className = 'tmrole';
    role.textContent = p.role;

    card.appendChild(photo);
    card.appendChild(name);
    card.appendChild(role);

    if(p.dept){
      var dept = document.createElement('div');
      dept.className = 'tmdept';
      dept.textContent = p.dept;
      card.appendChild(dept);
    }

    el.appendChild(card);
  });
}

renderGrid('facultyGrid', facultyCoordinators);
renderGrid('convenorGrid', convenors);
renderGrid('coConvenorGrid', coConvenors);
</script>
</body>
</html>
