name: CI Checks

# Runs on every pull request targeting main, and on every push to main
# (the push-to-main run is a second safety net right before deploy.yml runs).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Verify site (HTML validity, internal links, inline JS)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite
        run: bash scripts/verify.sh
